<!DOCTYPE html>
<html lang="en">
<head>
    <script src="ttt.js"></script>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>Allen H TicTacToe</title>
</head>
<body>
<h1 id="title">Allen H's Tic-Tac-Toe</h1>
<h3> <button onclick="twoP()">2 Player Mode</button> </h3>
<h3> <button onclick="oneP()">Single Player vs AI Mode</button> </h3>

<div id="game">
    <div class="grid-container">
            <div class="grid-item" onclick=move(0,1)></div>
            <div class="grid-item" onclick=move(0,2)></div>
            <div class="grid-item" onclick=move(0,3)></div>

            <div class="grid-item" onclick=move(1,1)></div>
            <div class="grid-item" onclick=move(1,2)></div>
            <div class="grid-item" onclick=move(1,3)></div>

            <div class="grid-item" onclick=move(2,1)></div>
            <div class="grid-item" onclick=move(2,2)></div>
            <div class="grid-item" onclick=move(2,3)></div>
    </div>
</div>
<div id="turn"></div>
<button onclick="clearGrid()">Clear Grid</button>
</body>
</html>
