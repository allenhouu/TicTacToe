<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="ttt.js"></script>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>Allen H TicTacToe</title>
</head>
<body>
<h1 id="title">Allen H's Tic-Tac-Toe</h1>
<h3 id="directions">Choose your space</h3>

<p id="turn"></p>
<div class="container">
    <div class="grid mx-auto">
        <button onclick="space1()">Space 1</button>
        <button onclick="space2()">Space 2</button>
        <button onclick="space3()">Space 3</button>
        <button onclick="space4()">Space 4</button>
        <button onclick="space5()">Space 5</button>
        <button onclick="space6()">Space 6</button>
        <button onclick="space7()">Space 7</button>
        <button onclick="space8()">Space 8</button>
        <button onclick="space9()">Space 9</button>
    </div>
</div>

<button onclick="clearGrid()">Clear Grid</button>
</body>
</html>
